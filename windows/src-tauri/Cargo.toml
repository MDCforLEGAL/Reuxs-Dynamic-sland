[package]
name = "reuxs"
version = "1.1.0"
description = "ReuXs — Material Capsule for Windows"
authors = ["ReuXs Contributors"]
license = "MIT"
repository = "https://github.com/MDCforLEGAL/Reuxs-Dynamic-sland"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "reuxs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System media transport controls (SMTC) for the live music module.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
