name: Release

# Triggered only when a release is published from the GitHub website.
# No signing keys, no keystores, no extra repository secrets: everything uses
# the built-in GITHUB_TOKEN.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: reuxs-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows (.msi + .exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target

      - name: Build Tauri bundle (unsigned)
        run: npm run tauri build
        env:
          CI: true

      - name: Upload Windows installers
        shell: bash
        working-directory: windows
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -R src-tauri/target/release/bundle
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe \
            --clobber

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK with the release tag in its name
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "ReuXs-${{ github.event.release.tag_name }}.apk"

      - name: Upload Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "ReuXs-$TAG.apk" --clobber
