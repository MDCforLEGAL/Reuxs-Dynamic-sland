name: Release

# Fully automatic, zero-secret releases.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Pushing a version tag builds both platforms and creates/publishes the GitHub
# Release with the installers attached. A manually published release and the
# "Run workflow" button trigger the same pipeline. Only the built-in
# GITHUB_TOKEN is used: no signing keys, no keystore, no extra secrets.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: reuxs-release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows (.msi + .exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target

      - name: Build Tauri bundle (unsigned)
        run: npm run tauri build
        env:
          CI: true

      - name: Stage installers
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/msi/*.msi dist/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          ls -R dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: windows/dist/*
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK with the release tag in its name
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          mkdir -p ../android-dist
          cp app/build/outputs/apk/debug/app-debug.apk "../android-dist/ReuXs-$TAG.apk"
          ls -l ../android-dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${EVENT_TAG:-${INPUT_TAG:-$REF_NAME}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG"

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release when it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — refreshing its assets."
          else
            gh release create "$TAG" \
              --title "ReuXs $TAG" \
              --generate-notes \
              --verify-tag
          fi

      - name: Upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ls -lR dist
          gh release upload "$TAG" dist/* --clobber
