name: Pages

# Publishes the static ReuXs site (site/) to the `Site` branch, which is the
# branch GitHub Pages is bound to (Settings → Pages → branch: Site / root).
# Every push to main that touches site/ updates the live page at
# https://mdcforlegal.github.io/Reuxs-Dynamic-sland/

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reuxs-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Deploy site/ to the Site branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: Site
          commit_message: "Publish ReuXs site (${{ github.sha }})"
          # .nojekyll keeps files that start with an underscore working.
          enable_jekyll: false
