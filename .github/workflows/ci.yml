name: CI

# Build verification for every push to main: the frontend typecheck, the Rust
# shell (SMTC bridge) and the Android app. Releases are handled separately by
# auto-release.yml + release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reuxs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + bundle the webview
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target

      - name: cargo check (Tauri shell + SMTC bridge)
        shell: bash
        working-directory: windows/src-tauri
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee cargo-check.log

      - name: Report Rust errors
        if: failure()
        shell: bash
        working-directory: windows/src-tauri
        run: |
          grep -E "^(error|warning: unused)" -A 6 cargo-check.log | head -n 80 || true

  android:
    name: Android build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)"
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee gradle-build.log

      - name: Report Kotlin errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|FAILURE: |Caused by:|> Task .* FAILED" gradle-build.log \
            | head -n 60 | sed 's/\r//g' | cut -c1-480 | while IFS= read -r line; do
              echo "::error::${line//'%'/'%25'}"
            done || true
